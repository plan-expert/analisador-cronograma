<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analisador de Cronograma</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#1c2430;--mute:#667085;--line:#e3e6eb;--acc:#1f5fbf;--acc-soft:#e8f0fc;
  --ok:#15803d;--warn:#b45309;--bad:#c62828;--plan:#1f5fbf;--real:#e07a00;--fc:#8a94a6;--grid:#e8eaee;
  --done:#2e9e5b;--prog:#2f6fd0;--todo:#b8bfcc;--late:#d64545;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12161c;--card:#1b212b;--ink:#e8ecf2;--mute:#97a1b2;--line:#2b3340;--acc:#6aa3ff;--acc-soft:#1f2c44;
  --ok:#4cc27d;--warn:#e0a040;--bad:#ff7b72;--plan:#6aa3ff;--real:#ffa94d;--fc:#7d8799;--grid:#262e3a;
  --done:#3fb872;--prog:#5b92ee;--todo:#4a5364;--late:#ff6b6b;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header .file{color:var(--mute);font-size:13px}
.spacer{flex:1}
#ctls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.ctl{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:12.5px}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
nav{display:flex;gap:2px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 14px;background:none;color:var(--mute);white-space:nowrap}
nav button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
main{padding:20px;max-width:1500px;margin:0 auto}
.drop{border:2px dashed var(--line);border-radius:12px;padding:56px 24px;text-align:center;background:var(--card);margin:40px auto;max-width:720px}
.drop.over{border-color:var(--acc);background:var(--acc-soft)}
.drop h2{margin:0 0 8px;font-size:20px}.drop p{color:var(--mute);margin:6px 0}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .l{color:var(--mute);font-size:12px}.kpi .v{font-size:24px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--mute);font-size:12px;margin-top:2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mute{color:var(--mute)}
h3{margin:22px 0 8px;font-size:14.5px}
h3:first-child{margin-top:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.tools{display:flex;gap:8px;align-items:center;margin:0 0 6px;flex-wrap:wrap}
.tw{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.wrap{white-space:normal;min-width:260px}
th{position:sticky;top:0;background:var(--card);cursor:pointer;color:var(--mute);font-weight:600;font-size:12px;z-index:1;user-select:none}
th:hover{color:var(--ink)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--acc-soft)}
tr.sum td{font-weight:600;background:color-mix(in srgb,var(--line) 35%,transparent)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11.5px;font-weight:600}
.t-done{background:color-mix(in srgb,var(--done) 18%,transparent);color:var(--done)}
.t-prog{background:color-mix(in srgb,var(--prog) 18%,transparent);color:var(--prog)}
.t-todo{background:color-mix(in srgb,var(--todo) 25%,transparent);color:var(--mute)}
.t-late{background:color-mix(in srgb,var(--late) 18%,transparent);color:var(--late)}
.t-crit{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.bar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;min-width:90px;position:relative}
.bar i{display:block;height:100%;background:var(--prog)}
.bar b{position:absolute;top:-2px;width:2px;height:12px;background:var(--ink);opacity:.7}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0}
.stack div{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:-1px}
.note{background:var(--acc-soft);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--ink);margin:0 0 12px}
.chartwrap{position:relative}
svg text{fill:var(--mute);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:none;white-space:nowrap;z-index:3}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.chk .card{cursor:pointer}.chk .card.on{border-color:var(--acc);background:var(--acc-soft)}
.chk .big{font-size:22px;font-weight:650}
.toggle{cursor:pointer;display:inline-block;width:16px;color:var(--mute)}
#loading{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;align-items:center;justify-content:center;color:#fff;font-size:18px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:8px 0 18px}
.gc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px 6px}
.gc .hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;min-height:44px;padding-right:18px}
.gc .ttl{font-size:12px;font-weight:600;letter-spacing:.2px;text-transform:uppercase;line-height:1.25;cursor:pointer;min-width:0;overflow-wrap:normal;word-break:normal;font-size:11px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gc .ttl:hover{color:var(--acc)}
.gc .bd{flex:none;color:#fff;border-radius:4px;padding:3px 7px;font-size:10.5px;font-weight:600;text-align:center;line-height:1.3}
.gc .rm{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--mute);padding:0 4px;font-size:16px;line-height:1}
.gc svg{display:block;width:100%;margin-top:2px}
.gc svg text{fill:var(--ink)}.gc svg .mut{fill:var(--mute);font-size:10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

.opw{position:relative;overflow:hidden;width:100%}
.pgw{display:none}.pgw.cur{display:block}
.pgtabs{display:flex;gap:4px;margin:6px 0 10px;border-bottom:1px solid var(--line)}.pgtabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 16px;font-weight:600;color:var(--mute)}.pgtabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.stage{--card:#fff;--ink:#14181f;--mute:#5b6577;--line:#cfd4dc;--grid:#e6e9ee;--plan:#2f8cf0;--fc:#1226a0;--real:#22b24c;--acc:#1226a0;
  width:1600px;height:900px;display:grid;grid-template-rows:46px 1fr;gap:8px;padding:8px;background:#fff;color:var(--ink);box-sizing:border-box;border:1px solid var(--line);transform-origin:top left;font-family:"Segoe UI",system-ui,sans-serif}
.stage *{box-sizing:border-box}
.sh{background:#1226a0;color:#fff;display:flex;align-items:center;padding:0 16px;gap:16px;border-radius:4px}
.sh input{background:transparent;border:0;color:#fff;font:inherit;outline:none;padding:0}
.sweek{width:380px;font-size:15px;font-weight:600}
.stt{flex:1}.stt input{width:100%;text-align:center;font-size:22px;font-weight:600}
.stage.cov{grid-template-rows:46px 1fr 40px}.covph{border-radius:0;border:0}.stage.cov .ph img{object-fit:cover}.sf{justify-content:center}.sf .stt span{display:block;text-align:center;font-weight:700;font-size:18px}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr) minmax(0,1fr) minmax(0,2.3fr);gap:8px;min-height:0}
.dgrid>*{min-height:0;overflow:hidden}.cell{display:flex}.cell>.gc{width:100%}
.dpics{flex:1;min-height:0;display:grid;gap:6px;padding:6px}.dpics .ph{min-height:0}
.sbody{display:grid;grid-template-columns:780px 1fr;gap:8px;min-height:0}
.sl{display:grid;grid-template-rows:380px 1fr;gap:8px;min-height:0}
.sg{display:grid;gap:8px;min-height:0;overflow:hidden}
.sg>*{min-height:0;overflow:hidden}
.sl{overflow:hidden}.sr{overflow:hidden}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}
.box{border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:#fff}
.bh{background:#1226a0;color:#fff;font-size:13px;font-weight:600;padding:5px 10px;flex:none}
.box textarea{flex:1;border:0;resize:none;padding:8px 10px;font-family:inherit;color:#14181f;background:#fff;outline:none;line-height:1.35}
.cvb{flex:1;min-height:0;padding:4px 6px;display:flex;flex-direction:column}.cvb svg{flex:1;min-height:0;width:100%}
.lg2{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--mute);padding-bottom:4px}
.lg2 span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:var(--c)}
.sr{display:grid;gap:8px;min-height:0}
.ph{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f3f5f8;cursor:pointer;min-height:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .phh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a94a6;font-size:14px;text-align:center;padding:10px}
.ph.has .phh{display:none}.ph.over{outline:3px solid #2f8cf0}
.ph .prm{position:absolute;top:6px;right:6px;display:none;background:#fff}
.ph.has:hover .prm{display:block}
.stage .gc{height:100%;display:flex;flex-direction:column;padding:8px 10px 4px}
.stage .gc svg{flex:1;min-height:0;width:100%}
.stage .gc .ttl{font-size:14px;color:#14181f}
.stage .gc .bd{font-size:11.5px}
.mgr td,.mgr th{padding:4px 8px}
.cedit{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}.ce{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--acc-soft);border-radius:12px;padding:2px 4px 2px 9px;font-size:12px}.chip button{border:0;background:none;padding:0 4px;color:var(--mute);cursor:pointer}
@media print{
  @page{size:1600px 900px;margin:0}
  html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header,nav,.noprint,.prm{display:none!important}
  main{padding:0!important;max-width:none!important}
  .pgw{display:block!important;break-after:page;page-break-after:always}.pgw:last-child{break-after:auto;page-break-after:auto}
  .opw{height:900px!important;overflow:visible}
  .stage{transform:none!important;border:0}
  .ph .phh{display:none}
}
</style>
</head>
<body>
<div id="loading">Lendo o cronograma…</div>
<header>
  <h1>Analisador de Cronograma</h1>
  <span class="file" id="fname"></span>
  <span class="spacer"></span>
  <span id="ctls"></span>
</header>
<nav id="nav"></nav>
<main id="view"></main>
<input type="file" id="fileIn" accept=".xml" multiple hidden>
<input type="file" id="fileAdd" accept=".xml" multiple hidden>
<input type="file" id="phIn" accept="image/*" hidden>
<input type="file" id="bkIn" accept=".json" hidden>
<input type="file" id="fileCmp" accept=".xml" hidden>

<script>
'use strict';
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY=864e5;
const pd=s=>s?new Date(s):null;
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const eod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59);
const fd=d=>d?d.toLocaleDateString('pt-BR'):'';
const nf=(v,dp=1)=>v==null||isNaN(v)?'':v.toLocaleString('pt-BR',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const dd=(a,b)=>Math.round((sod(a)-sod(b))/DAY);
const hrs=s=>{const m=/^-?P(?:(\d+)D)?(?:T(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)S)?)?$/.exec((s||'').trim());return m?(+m[1]||0)*24+(+m[2]||0)+(+m[3]||0)/60+(+m[4]||0)/3600:0};
const isoDay=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const frac=(a,b,d)=>{ if(!a||!b) return 0; if(d>=b) return 1; if(d<=a) return 0; return (d-a)/(b-a); };

/* ============ leitura do XML (MSPDI) ============ */
function parseMSP(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('O arquivo não é um XML válido.');
  const root=doc.documentElement;
  if(root.localName!=='Project') throw new Error('Este XML não parece ser do MS Project (formato MSPDI). Use Arquivo > Salvar como > XML.');
  const P={info:{},tasks:[],res:{},assign:{},fields:{},tp:{}};
  const kids=(el,n)=>[...el.children].filter(c=>c.localName===n);
  for(const c of root.children) if(!c.children.length) P.info[c.localName]=c.textContent;
  for(const sec of root.children){
    const ln=sec.localName;
    if(ln==='ExtendedAttributes'){
      for(const e of sec.children){const o={};for(const c of e.children)o[c.localName]=c.textContent;P.fields[o.FieldID]=o.Alias||o.FieldName||o.FieldID;}
    } else if(ln==='Resources'){
      for(const r of sec.children){const o={};for(const c of r.children)if(!c.children.length)o[c.localName]=c.textContent;P.res[o.UID]=o.Name||'';}
    } else if(ln==='Assignments'){
      for(const a of sec.children){const o={},tp=[];for(const c of a.children){
          if(c.localName==='TimephasedData'){const q={};for(const x of c.children)q[x.localName]=x.textContent;if(q.Type==='2'||q.Type==='4')tp.push({ty:+q.Type,s:pd(q.Start),f:pd(q.Finish),h:hrs(q.Value)});}
          else if(!c.children.length)o[c.localName]=c.textContent;}
        if(tp.length)(P.tp[o.TaskUID]=P.tp[o.TaskUID]||[]).push(...tp);
        if(+o.ResourceUID>0&&P.res[o.ResourceUID]!==undefined) (P.assign[o.TaskUID]=P.assign[o.TaskUID]||[]).push(P.res[o.ResourceUID]||('Recurso '+o.ResourceUID));}
    } else if(ln==='Tasks'){
      for(const el of sec.children){
        const o={ext:{},preds:[],base:null};
        for(const c of el.children){
          const n=c.localName;
          if(n==='PredecessorLink'){const p={};for(const x of c.children)p[x.localName]=x.textContent;o.preds.push({uid:+p.PredecessorUID,type:+p.Type,lag:(+p.LinkLag||0)/10/60});}
          else if(n==='Baseline'){const b={};for(const x of c.children)b[x.localName]=x.textContent;(o.bls=o.bls||{})[b.Number||'0']=b;}
          else if(n==='ExtendedAttribute'){let id,v;for(const x of c.children){if(x.localName==='FieldID')id=x.textContent;if(x.localName==='Value')v=x.textContent;}o.ext[id]=v;}
          else if(!c.children.length) o[n]=c.textContent;
        }
        P.tasks.push(o);
      }
    }
  }
  if(!P.tasks.length) throw new Error('Nenhuma tarefa encontrada no arquivo.');
  // usa só a "Linha de base" principal (Baseline 0), como o Project; se o arquivo não tiver, usa a de menor número
  {const nums=new Set();for(const t of P.tasks)if(t.bls)for(const k in t.bls)nums.add(k);
   const use=nums.has('0')?'0':[...nums].sort((x,y)=>+x-+y)[0];
   P.baseNum=use;for(const t of P.tasks)t.base=(t.bls&&use!=null&&t.bls[use])||null;}
  return P;
}

function build(P){
  const mpd=(+P.info.MinutesPerDay||480)/60;
  const T=[],byUid=new Map();
  const stack=[];
  for(const t of P.tasks){
    if(t.IsNull==='1') continue;
    const o={
      uid:+t.UID,id:+t.ID,name:(t.Name||'').trim(),wbs:t.WBS||'',lvl:+t.OutlineLevel||0,
      sum:t.Summary==='1',crit:t.Critical==='1',pct:+t.PercentComplete||0,
      start:pd(t.Start),finish:pd(t.Finish),as:pd(t.ActualStart),af:pd(t.ActualFinish),
      dur:hrs(t.Duration)/mpd,work:hrs(t.Work),aw:hrs(t.ActualWork),bw:t.base?hrs(t.base.Work):0,tpA:(P.tp[t.UID]||[]).filter(x=>x.ty===2),tpB:(P.tp[t.UID]||[]).filter(x=>x.ty===4),cost:+t.Cost||0,
      slack:(+t.TotalSlack||0)/10/60/mpd,constr:+t.ConstraintType||0,
      preds:t.preds,res:P.assign[t.UID]||[],ext:t.ext,
      bs:t.base?pd(t.base.Start):null,bf:t.base?pd(t.base.Finish):null,
      kids:[],succ:0
    };
    o.ms=t.Milestone==='1'||(!o.sum&&o.dur===0);
    o.leaf=!o.sum;
    o.parent=o.lvl>0?(stack[o.lvl-1]||null):null;
    o.path=o.parent?[...o.parent.path,o]:[o];
    stack.length=o.lvl;stack[o.lvl]=o;
    if(o.parent)o.parent.kids.push(o);
    T.push(o);byUid.set(o.uid,o);
  }
  for(const t of T)for(const p of t.preds){const q=byUid.get(p.uid);if(q)q.succ++;}
  const info=P.info;
  return {P,T,byUid,leaves:T.filter(t=>t.leaf),mpd,
    title:info.Title||info.Name||'Projeto',
    status:info.StatusDate?pd(info.StatusDate):null,
    pStart:pd(info.StartDate),pFinish:pd(info.FinishDate),
    hasBase:T.some(t=>t.bs&&t.leaf),lastFinish:T.filter(t=>t.leaf).reduce((a,t)=>!a||t.finish>a?t.finish:a,null),fields:P.fields};
}

/* ============ estado ============ */
let M=null,CMP=null;
const TH_COL={ok:'#2e9e5b',warn:'#d68a00',bad:'#d64545'};
function saveCards(){try{localStorage.setItem('ac:'+M.title,JSON.stringify({c:S.cards,t:S.thr}));}catch(e){}}
function loadCards(){
  let sv=null;try{sv=JSON.parse(localStorage.getItem('ac:'+M.title));}catch(e){}
  if(sv&&Array.isArray(sv.c)){S.cards=sv.c.filter(u=>M.byUid.has(u));if(sv.t)S.thr=sv.t;}
  else{S.cards=M.T.filter(t=>t.sum&&t.lvl<=1).map(t=>t.uid);}
}
function gauge(o){
  const real=Math.max(0,Math.min(100,o.real||0)),prev=o.prev==null?null:Math.max(0,Math.min(100,o.prev));
  const ad=o.ad!=null?o.ad:prev>0?real/prev*100:100;
  const st=ad>=S.thr.ok?'ok':ad>=S.thr.warn?'warn':'bad',col=TH_COL[st];
  const cx=140,cy=108,r=78,sw=28;
  const pt=(p,rr)=>{const a=Math.PI*(1-p/100);return[cx+rr*Math.cos(a),cy-rr*Math.sin(a)];};
  const arc=p=>{if(p<=0)return'';p=Math.min(p,99.99);const a=pt(0,r),b=pt(p,r);return `M${a[0].toFixed(1)} ${a[1].toFixed(1)}A${r} ${r} 0 0 1 ${b[0].toFixed(1)} ${b[1].toFixed(1)}`;};
  let mk='';
  if(prev!=null){const a=pt(prev,r-sw/2-3),b=pt(prev,r+sw/2+3),l=pt(prev,r+sw/2+13);
    mk=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#1f4fd8" stroke-width="3"/><text x="${l[0]}" y="${prev>=90||prev<=10?l[1]-7:l[1]+3}" text-anchor="${prev>=90?'start':prev<=10?'end':'middle'}" style="font-size:11px;font-weight:600;fill:#1f4fd8">${nf(prev,0)}%</text>`;}
  const dt=o.max?fd(o.max):'';

/* ============ análise ============ */
let A=null;
function baseSource(){
  if(S.base==='baseline'&&M.hasBase)return 'baseline';
  if(S.base==='compare'&&CMP)return 'compare';
  if(S.base==='atual')return 'atual';
  if(M.hasBase)return 'baseline';
  if(CMP)return 'compare';
  return 'atual';
}
function analyze(){
  const src=baseSource(),cut=eod(S.cutoff);
  const w={dur:t=>t.ms?0:t.dur,work:t=>t.work,cost:t=>t.cost,eq:t=>t.ms?0:1};
  let wf=w[S.weight];
  if(M.leaves.reduce((s,t)=>s+wf(t),0)<=0)wf=w.eq;
  for(const t of M.T){t.W=0;t.WR=0;t.WP=0;t.WPd=0;t.n=0;t.nLate=0;t.nCrit=0;t.nDone=0;t.min=null;t.max=null;}
  const cmpMap=CMP?CMP.byUid:null;
  // peso do PREVISTO: com Peso=Trabalho e linha de base, o previsto é horas de base acumuladas ÷ horas de base totais (como no Project)
  let wpBase=S.weight==='work'&&src==='baseline';
  for(const t of M.leaves){t.wp=wpBase?(t.bs?t.bw:0):wf(t);t.hasTp=src==='baseline'&&t.tpB.length>0;}
  if(wpBase&&!M.leaves.some(t=>t.wp>0)){wpBase=false;for(const t of M.leaves)t.wp=wf(t);}
  // horas (ou peso) previstos até a data d: em modo base-de-trabalho usa as horas da base em fases de tempo, como o Project
  const ph=(t,d,use,w)=>use?(t.hasTp?cumTP(t.tpB,d):(t.bs?t.bw*frac(t.ps,t.pf,d):0)):w*(t.useTpB?Math.min(1,cumTP(t.tpB,d)/t.bw):frac(t.ps,t.pf,d));
  const cumTP=(l,d)=>{let v=0;for(const x of l)v+=x.h*frac(x.s,x.f,d);return v;};
  for(const t of M.leaves){
    let bs=t.start,bf=t.finish,has=false;
    if(src==='baseline'&&t.bs){bs=t.bs;bf=t.bf;has=true;}
    else if(src==='compare'&&cmpMap&&cmpMap.has(t.uid)){const c=cmpMap.get(t.uid);bs=c.start;bf=c.finish;has=true;}
    t.ps=bs;t.pf=bf;t.hasBase=has;
    t.varF=has?dd(t.finish,bf):null;
    t.varS=has?dd(t.start,bs):null;
    t.wt=wf(t);
    t.useTpB=src==='baseline'&&has&&t.tpB.length>0&&t.bw>0;
    t.plan=t.useTpB?Math.min(1,cumTP(t.tpB,cut)/t.bw):frac(bs,bf,cut);
    t.rf=S.real==='work'&&t.work>0?Math.min(1,t.aw/t.work):t.pct/100;
    t.done=t.pct>=100;
    t.stat=t.done?'Concluída':t.pct>0?'Em andamento':'Não iniciada';
    t.lateF=!t.done&&t.finish&&sod(t.finish)<sod(S.cutoff);
    t.lateS=!t.done&&t.pct===0&&t.start&&sod(t.start)<sod(S.cutoff);
    t.delay=t.lateF?dd(S.cutoff,t.finish):0;
    for(const a of t.path){
      a.W+=t.wt;a.WR+=t.wt*t.rf;a.WP+=t.wp*t.plan;a.WPd+=t.wp;a.n++;
      if(t.lateF)a.nLate++;if(t.crit&&!t.done)a.nCrit++;if(t.done)a.nDone++;
      if(!a.min||t.start<a.min)a.min=t.start;if(!a.max||t.finish>a.max)a.max=t.finish;
    }
  }
  for(const t of M.T){
    if(t.leaf){t.real=t.rf*100;t.prev=t.plan*100;}
    else if(t.W>0){t.real=t.WR/t.W*100;t.prev=t.WPd>0?t.WP/t.WPd*100:null;}
    else{t.real=t.pct;t.prev=null;}
  }
  const root=M.T.find(t=>t.lvl===0&&t.sum)||{W:0,WR:0,WP:0};
  const W=M.leaves.reduce((s,t)=>s+t.wt,0)||1,WR=M.leaves.reduce((s,t)=>s+t.wt*t.rf,0),WP=M.leaves.reduce((s,t)=>s+t.wp*t.plan,0),WPd=M.leaves.reduce((s,t)=>s+t.wp,0)||1;
  A={src,cut,W,real:WR/W*100,prev:WP/WPd*100,spi:WP>0?(WR/W)/(WP/WPd):null};
  const node=M.scope!=null?M.byUid.get(M.scope):null;
  const SL=node?M.leaves.filter(t=>t.path.includes(node)):M.leaves;
  const rawW=SL.reduce((s,t)=>s+t.wt,0),fb=rawW<=0;
  for(const t of SL)t.wtc=fb?(t.ms?0:1):t.wt;
  const wpOk=!fb&&SL.some(t=>t.wp>0);
  for(const t of SL)t.wpc=wpOk?t.wp:t.wtc;
  const Wc=SL.reduce((s,t)=>s+t.wtc,0)||1,Wp=SL.reduce((s,t)=>s+t.wpc,0)||1,WRc=SL.reduce((s,t)=>s+t.wtc*t.rf,0),WPc=SL.reduce((s,t)=>s+t.wpc*t.plan,0);
  A.sc={fb,node,n:SL.length,W:Wc,real:WRc/Wc*100,prev:WPc/Wp*100,spi:WPc>0?(WRc/Wc)/(WPc/Wp):null};
  // curva S
  let d0=null,d1=null;
  for(const t of SL){for(const d of [t.start,t.finish,t.ps,t.pf,t.as,t.af]){if(!d)continue;if(!d0||d<d0)d0=d;if(!d1||d>d1)d1=d;}}
  d0=sod(d0);d1=sod(d1);
  const days=[];for(let d=new Date(d0);d<=d1;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))days.push(d);
  const plan=new Array(days.length).fill(0),act=new Array(days.length).fill(null),fc=new Array(days.length).fill(null);
  const ci=days.findIndex(d=>sod(d).getTime()===sod(S.cutoff).getTime());
  const cutIdx=ci<0?(sod(S.cutoff)<days[0]?-1:days.length-1):ci;
  const ends=days.map(eod);
  for(const t of SL){
    if(t.wtc<=0&&t.wpc<=0)continue;
    const a0=t.as||t.start,a1=t.af||cut;
    for(let i=0;i<days.length;i++){
      plan[i]+=t.wpc*(t.useTpB?Math.min(1,cumTP(t.tpB,ends[i])/t.bw):frac(t.ps,t.pf,ends[i]));
    }
    for(let i=0;i<=cutIdx;i++){
      let v=0;
      if(S.real==='work'&&t.tpA.length&&t.work>0)v=t.wtc*Math.min(1,cumTP(t.tpA,ends[i])/t.work);
      else if(t.rf>0&&a0<=cut)v=t.wtc*t.rf*frac(a0,a1<=a0?new Date(+a0+1):a1,ends[i]);
      act[i]=(act[i]||0)+v;
    }
    const rem=t.wtc*(1-t.rf);
    const f0=t.start>cut?t.start:cut,f1=t.finish>f0?t.finish:new Date(+f0+DAY);
    for(let i=Math.max(cutIdx,0);i<days.length;i++){
      fc[i]=(fc[i]||0)+(t.wtc*t.rf)+(rem>0?rem*frac(f0,f1,ends[i]):0);
    }
  }
  A.curve={days,plan:plan.map(v=>v/Wp*100),act:act.map(v=>v==null?null:v/Wc*100),fc:fc.map(v=>v==null?null:v/Wc*100),cutIdx};
  // forecast: ajuste final em cutIdx para coincidir com realizado
  if(cutIdx>=0&&A.curve.act[cutIdx]!=null)A.curve.fc[cutIdx]=A.curve.act[cutIdx];
}

function aggCurve(ms){
  const g=aggr(ms),cs=ms.map(m=>m.Afull.curve);
  const d0=new Date(Math.min(...cs.map(c=>+c.days[0]))),d1=new Date(Math.max(...cs.map(c=>+c.days[c.days.length-1])));
  const days=[];for(let d=new Date(d0);d<=d1;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))days.push(d);
  const cut=sod(S.cutoff);let ci=days.findIndex(d=>+sod(d)===+cut);if(ci<0)ci=cut<days[0]?-1:days.length-1;
  const last=cs.map(c=>{let v=0;for(const x of c.act)if(x!=null)v=x;return v;});
  const plan=[],act=[],fc=[];
  days.forEach((d,i)=>{let p=0,a=0,f=0;
    cs.forEach((c,j)=>{const off=Math.round((sod(d)-sod(c.days[0]))/DAY),k=Math.min(off,c.days.length-1);
      if(off>=0){p+=g.w[j]*c.plan[k];a+=g.w[j]*(c.act[k]==null?last[j]:c.act[k]);f+=g.w[j]*(c.fc[k]==null?(c.act[k]==null?last[j]:c.act[k]):c.fc[k]);}});
    plan.push(p/g.sw);act.push(i<=ci?a/g.sw:null);fc.push(ci>=0&&i>=ci?f/g.sw:null);});
  return {days,plan,act,fc,cutIdx:ci};
}

function chartSvg(C,id,W,H){
  C=C||A.curve;id=id||'scsvg';W=W||1000;H=H||400;const m={l:46,r:16,t:14,b:34};
  const n=C.days.length,x=i=>m.l+(W-m.l-m.r)*i/Math.max(1,n-1),y=v=>m.t+(H-m.t-m.b)*(1-v/100);
  const line=(arr,cls,dash)=>{let d='',pen=false;arr.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);pen=true;});return `<path d="${d}" fill="none" stroke="var(${cls})" stroke-width="2.2" ${dash?'stroke-dasharray="6 5"':''}/>`;};
  let g='';for(let v=0;v<=100;v+=20)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`;
  const step=Math.max(1,Math.ceil(n/30/Math.max(3,Math.floor(W/95))));let lastM=-1,xt='';
  C.days.forEach((d,i)=>{const k=d.getFullYear()*12+d.getMonth();if(k!==lastM){lastM=k;if(((k%step)===0||step===1)){xt+=`<line x1="${x(i)}" x2="${x(i)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--grid)"/><text x="${x(i)}" y="${H-12}" text-anchor="middle">${d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.','').replace(' de ','/')}</text>`;}}});
  const cx=C.cutIdx>=0?x(C.cutIdx):null;
  return `<svg id="${id}" viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}${xt}
    ${cx!=null?`<line x1="${cx}" x2="${cx}" y1="${m.t}" y2="${H-m.b}" stroke="var(--mute)" stroke-dasharray="3 4"/><text x="${cx+5}" y="${m.t+10}">corte ${fd(S.cutoff)}</text>`:''}
    ${line(C.plan,'--plan')}${line(C.fc,'--fc',1)}${line(C.act,'--real')}
    <line id="${id}-hov" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="var(--ink)" opacity="0"/></svg>`;
}

function bindChart(){
  const svg=$('#scsvg');if(!svg)return;const tip=$('#tip'),hov=$('#scsvg-hov'),wrap=$('#scwrap');
  const C=A.curve,W=1000,m={l:46,r:16};
  svg.addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(C.days.length-1,Math.round((px-m.l)/(W-m.l-m.r)*(C.days.length-1))));
    const xx=m.l+(W-m.l-m.r)*i/Math.max(1,C.days.length-1);
    hov.setAttribute('x1',xx);hov.setAttribute('x2',xx);hov.setAttribute('opacity',.35);
    tip.style.display='block';
    tip.innerHTML=`<b>${fd(C.days[i])}</b><br>Previsto: ${nf(C.plan[i])}%`+(C.act[i]!=null?`<br>Realizado: ${nf(C.act[i])}%`:'')+(C.fc[i]!=null&&i>C.cutIdx?`<br>Projeção: ${nf(C.fc[i])}%`:'');
    const wr=wrap.getBoundingClientRect();let lx=e.clientX-wr.left+14;if(lx>wr.width-170)lx-=190;
    tip.style.left=lx+'px';tip.style.top=(e.clientY-wr.top-10)+'px';
  });
  svg.addEventListener('mouseleave',()=>{tip.style.display='none';hov.setAttribute('opacity',0);});
}

function groupKeys(){
  const o=[['wbs1','WBS – nível 1'],['wbs2','WBS – nível 2'],['wbs3','WBS – nível 3'],['cwa','CWA (detectado no nome)'],['cwp','CWP (detectado no nome)'],['res','Recurso']];
  for(const [id,al] of Object.entries(M.fields)){
    const vals=new Set();let cnt=0;
    for(const t of M.leaves){const v=t.ext[id];if(v!=null&&v!==''){cnt++;vals.add(v);}}
    if(cnt>0&&vals.size>=2&&vals.size<=200&&![...vals].every(v=>/^-?[\d.,]+$/.test(v)))o.push(['f:'+id,'Campo: '+al]);
  }
  return o;
}
function keyOf(t,g){
  if(g.startsWith('wbs')){const n=+g.slice(3);return (t.path[n]&&t.path[n]!==t)?t.path[n].wbs+' '+t.path[n].name:(t.path[n]===t?t.wbs+' '+t.name:'(sem nível '+n+')');}
  if(g==='cwa'||g==='cwp'){const re=g==='cwa'?/CWA[\s\-_]*0*(\d+)/i:/CWP[\s\-_]*0*(\d+)/i,L=g.toUpperCase();
    for(let i=t.path.length-1;i>=0;i--){const m=re.exec(t.path[i].name);if(m)return L+' '+m[1].padStart(2,'0');}return '(não identificado)';}
  if(g==='res')return t.res.length?t.res.join(', '):'(sem recurso)';
  if(g.startsWith('f:'))return t.ext[g.slice(2)]||'(vazio)';
  return '';
}
function viewGrupos(){
  const keys=groupKeys();if(!keys.some(k=>k[0]===S.group))S.group='wbs1';
  const map=new Map();
  for(const t of M.leaves){const k=keyOf(t,S.group);let g=map.get(k);if(!g){g={k,n:0,W:0,WR:0,WP:0,WPd:0,late:0,crit:0,done:0,min:null,max:null};map.set(k,g);}
    g.n++;g.W+=t.wt;g.WR+=t.wt*t.rf;g.WP+=t.wp*t.plan;g.WPd+=t.wp;if(t.lateF)g.late++;if(t.crit&&!t.done)g.crit++;if(t.done)g.done++;
    if(!g.min||t.start<g.min)g.min=t.start;if(!g.max||t.finish>g.max)g.max=t.finish;}
  const rows=[...map.values()].map(g=>({...g,real:g.W?g.WR/g.W*100:null,prev:g.WPd?g.WP/g.WPd*100:null,peso:g.W/A.W*100}));
  return `<div class="tools"><label class="ctl">Agrupar por <select id="grpSel">${keys.map(k=>`<option value="${k[0]}" ${S.group===k[0]?'selected':''}>${esc(k[1])}</option>`).join('')}</select></label></div>
  ${tbl('grupos',[
    {h:'Grupo',v:r=>r.k,wrap:1},{h:'Tarefas',t:'n',dp:0,v:r=>r.n},{h:'Peso %',t:'n',v:r=>r.peso},{h:'Real %',t:'n',v:r=>r.real},{h:'Prev. %',t:'n',v:r=>r.prev},
    {h:'Desvio',t:'n',v:r=>r.real==null?null:r.real-r.prev,f:r=>dev(r.real==null?null:r.real-r.prev)},{h:'Progresso',v:r=>r.real,f:r=>bar(r.real,r.prev)},
    {h:'Início',t:'d',v:r=>r.min},{h:'Término',t:'d',v:r=>r.max},{h:'Concl.',t:'n',dp:0,v:r=>r.done},{h:'Atras.',t:'n',dp:0,v:r=>r.late},{h:'Críticas',t:'n',dp:0,v:r=>r.crit}
  ],rows)}`;
}

function viewMarcos(){
  const all=M.leaves.filter(t=>t.ms);
  const rows=all.filter(t=>S.msFilter==='all'||(S.msFilter==='open'&&!t.done)||(S.msFilter==='late'&&t.lateF)||(S.msFilter==='done'&&t.done));
  return `<div class="tools"><label class="ctl">Mostrar <select id="msSel">${[['all','Todos'],['open','Pendentes'],['late','Atrasados'],['done','Concluídos']].map(o=>`<option value="${o[0]}" ${S.msFilter===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label></div>
  ${tbl('marcos',[
    {h:'WBS',v:t=>t.wbs},{h:'Marco',v:t=>t.name,wrap:1},{h:'Data',t:'d',v:t=>t.finish},{h:'Situação',v:t=>t.stat,f:t=>tagStat(t)},{h:'Atraso (d)',t:'n',dp:0,v:t=>t.delay},
    {h:'Folga (d)',t:'n',dp:0,v:t=>t.slack},{h:'Crítico',v:t=>t.crit?'Sim':''},...baseCols()
  ],rows)}`;
}

function checks(){
  const cut=eod(S.cutoff);
  const L=M.leaves,inc=L.filter(t=>!t.done),incN=inc.filter(t=>!t.ms),n=incN.length||1;
  const C=[
    ['Sem predecessora','Tarefas abertas sem nenhum vínculo de entrada',incN.filter(t=>!t.preds.length),n,5],
    ['Sem sucessora','Tarefas abertas sem vínculo de saída',incN.filter(t=>!t.succ),n,5],
    ['Lag negativo (antecipação)','Vínculos com lead',L.filter(t=>t.preds.some(p=>p.lag<0)),L.length,0],
    ['Lag positivo','Vínculos com defasagem positiva',L.filter(t=>t.preds.some(p=>p.lag>0)),L.length,5],
    ['Vínculos não FS','Pelo menos um vínculo FF, SS ou SF',L.filter(t=>t.preds.some(p=>p.type!==1)),L.length,10],
    ['Restrição rígida','Deve começar/terminar em (abertas)',inc.filter(t=>t.constr===2||t.constr===3),inc.length||1,5],
    ['Duração > 44 dias úteis','Tarefas abertas muito longas',incN.filter(t=>t.dur>44),n,5],
    ['Folga total > 44 dias','Tarefas abertas com muita folga',incN.filter(t=>t.slack>44),n,5],
    ['Sem recurso','Tarefas abertas sem atribuição',incN.filter(t=>!t.res.length),n,null],
    ['Término vencido','Término anterior ao corte, não concluídas',L.filter(t=>t.lateF),L.length,0],
    ['% sem data real de início','Progresso > 0 sem início real',L.filter(t=>t.pct>0&&!t.as),L.length,0],
    ['Concluída sem término real','100% sem data de término real',L.filter(t=>t.done&&!t.af),L.length,0],
    ['Data real no futuro','Início/término real depois do corte',L.filter(t=>(t.as&&t.as>cut)||(t.af&&t.af>cut)),L.length,0],
    ['Previsto no passado sem andamento','Início anterior ao corte e 0%',L.filter(t=>t.lateS),L.length,0],
  ];
  return C.map((c,i)=>({id:i,label:c[0],desc:c[1],list:c[2],base:c[3],lim:c[4],pct:c[2].length/c[3]*100}));
}
function viewQualidade(){
  const C=checks();
  if(S.chk==null||!C[S.chk])S.chk=0;
  const sel=C[S.chk];
  return `<div class="note">Verificações de saúde do cronograma (inspiradas nos 14 pontos DCMA). Clique em um cartão para ver as tarefas. Limites de referência são orientativos.</div>
  <div class="chk">${C.map(c=>{const bad=c.lim!=null&&c.pct>c.lim,cls=c.list.length===0?'ok':bad?'bad':'warn';
    return `<div class="card ${S.chk===c.id?'on':''}" data-chk="${c.id}"><div class="mute" style="font-size:12px">${esc(c.label)}</div><div class="big ${cls}">${c.list.length} <span class="mute" style="font-size:13px;font-weight:400">(${nf(c.pct)}%)</span></div><div class="mute" style="font-size:12px">${esc(c.desc)}${c.lim!=null?' · ref. ≤ '+c.lim+'%':''}</div></div>`;}).join('')}</div>
  <h3>${esc(sel.label)} — ${sel.list.length} tarefa(s)</h3>
  ${tbl('qualidade',[{h:'WBS',v:t=>t.wbs},{h:'Tarefa',v:t=>t.name,wrap:1},{h:'Início',t:'d',v:t=>t.start},{h:'Término',t:'d',v:t=>t.finish},{h:'Dur. (d)',t:'n',dp:0,v:t=>t.dur},{h:'%',t:'n',dp:0,v:t=>t.pct},{h:'Folga (d)',t:'n',dp:0,v:t=>t.slack},{h:'Predec.',t:'n',dp:0,v:t=>t.preds.length},{h:'Suces.',t:'n',dp:0,v:t=>t.succ}],sel.list)}`;
}

function viewComparar(){
  let body='';
  if(CMP){
    const cur=M.byUid,old=CMP.byUid;
    const rows=[];
    for(const t of M.leaves){const o=old.get(t.uid);
      if(!o)rows.push({k:'Nova',t,o:null});
      else{const ds=dd(t.start,o.start),df=dd(t.finish,o.finish),dp=t.pct-o.pct,dr=t.dur-o.dur;
        if(ds||df||dp||Math.abs(dr)>0.01)rows.push({k:'Alterada',t,o,ds,df,dp,dr});}}
    for(const o of CMP.leaves)if(!cur.has(o.uid))rows.push({k:'Removida',t:o,o});
    const cnt=k=>rows.filter(r=>r.k===k).length;
    const pf=M.pFinish&&CMP.pFinish?dd(M.pFinish,CMP.pFinish):null;
    body=`<div class="grid kpis" style="margin:12px 0">
      ${kpi('Versão anterior',esc(CMP.file),'')}
      ${kpi('Término do projeto',pf==null?'—':(pf>0?'+':'')+pf+' d',fd(CMP.pFinish)+' → '+fd(M.pFinish),pf>0?'bad':pf<0?'ok':'')}
      ${kpi('Tarefas alteradas',cnt('Alterada'),'')}${kpi('Novas',cnt('Nova'),'')}${kpi('Removidas',cnt('Removida'),'')}
      ${kpi('Término mais tarde',rows.filter(r=>r.df>0).length,'tarefas',rows.filter(r=>r.df>0).length?'warn':'')}
    </div>
    <div class="tools"><label class="ctl"><input type="checkbox" id="useCmp" ${S.base==='compare'||(S.base==='auto'&&!M.hasBase)?'checked':''}> Usar esta versão como base da Curva S e dos desvios</label></div>
    ${tbl('comparar',[
      {h:'Tipo',v:r=>r.k},{h:'WBS',v:r=>r.t.wbs},{h:'Tarefa',v:r=>r.t.name,wrap:1},
      {h:'Início ant.',t:'d',v:r=>r.o?r.o.start:null},{h:'Início atual',t:'d',v:r=>r.k==='Removida'?null:r.t.start},{h:'Δ início (d)',t:'n',dp:0,v:r=>r.ds},
      {h:'Térm. ant.',t:'d',v:r=>r.o?r.o.finish:null},{h:'Térm. atual',t:'d',v:r=>r.k==='Removida'?null:r.t.finish},{h:'Δ término (d)',t:'n',dp:0,v:r=>r.df,f:r=>r.df==null?'':`<span class="${r.df>0?'bad':r.df<0?'ok':''}">${r.df>0?'+':''}${r.df}</span>`},
      {h:'% ant.',t:'n',dp:0,v:r=>r.o?r.o.pct:null},{h:'% atual',t:'n',dp:0,v:r=>r.k==='Removida'?null:r.t.pct},{h:'Δ %',t:'n',dp:0,v:r=>r.dp},{h:'Δ dur. (d)',t:'n',v:r=>r.dr}
    ],rows)}`;
  }
  return `<div class="note">Carregue um XML de uma <b>versão anterior</b> do mesmo cronograma (por exemplo, o da semana passada ou a linha de base exportada). As tarefas são casadas pelo UID do MS Project. O resultado mostra o que mudou e permite usar essa versão como base de comparação na Curva S.</div>
  <div class="tools"><button class="pri" id="btnCmp">${CMP?'Trocar versão anterior…':'Carregar versão anterior (.xml)…'}</button>${CMP?'<button id="btnCmpX">Remover</button>':''}</div>${body}`;
}

/* ============ render ============ */
const VIEWS={folha:viewFolha,onepage:viewOnepage,resumo:viewResumo,curva:viewCurva,estrutura:viewEstrutura,atrasos:viewAtrasos,critico:viewCritico,grupos:viewGrupos,marcos:viewMarcos,qualidade:viewQualidade,comparar:viewComparar};

    <label class="ctl">Peso <select id="weight">${[['dur','Duração'],['work','Trabalho'],['cost','Custo'],['eq','Igual']].map(o=>`<option value="${o[0]}" ${S.weight===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>
    <label class="ctl">Realizado <select id="realSel"><option value="work" ${S.real==='work'?'selected':''}>Trabalho real acum.</option><option value="pct" ${S.real==='pct'?'selected':''}>% concluído</option></select></label>
    <label class="ctl">Base <select id="baseSel"><option value="auto" ${S.base==='auto'?'selected':''}>Automática</option>${M.hasBase?`<option value="baseline" ${S.base==='baseline'?'selected':''}>Linha de base</option>`:''}${CMP?`<option value="compare" ${S.base==='compare'?'selected':''}>Versão anterior</option>`:''}<option value="atual" ${S.base==='atual'?'selected':''}>Datas atuais</option></select></label>
    <button id="btnAdd">+ Cronograma</button>${S.models.length>1?`<select id="actSel">${S.models.map((m,i)=>`<option value="${i}" ${m===M?'selected':''}>${esc(m.name)}</option>`).join('')}</select>`:''}<button id="btnNew">Abrir outro</button>`;

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-sort],[data-csv],[data-tog],[data-expand],[data-chk],[data-oprm],[data-cki],[data-cup],[data-cdn],#opNew,#opMan,[data-mact],[data-mrm],[data-phrm],[data-pgsel],[data-ftog],[data-fx],[data-fpre],#bkSave,#bkOpen,#pdef,#weekAuto,.ph,#btnAdd,#opAdd,#phMinus,#phPlus,#btnPrint,[data-cardrm],[data-cardlvl],[data-cardscope],#cardAdd,#cardClear,#btnOpen,#btnNew,#btnToday,#btnStatus,#btnCmp,#btnCmpX');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();window.scrollTo(0,0);}
  else if(t.dataset.sort){const [id,i]=t.dataset.sort.split('|');const c=S.sort[id];S.sort[id]=c&&c.i==+i?{i:+i,dir:-c.dir}:{i:+i,dir:1};drawTable(id);}
  else if(t.dataset.csv)exportCsv(t.dataset.csv);
  else if(t.dataset.tog){const u=+t.dataset.tog;S.collapsed.has(u)?S.collapsed.delete(u):S.collapsed.add(u);render();}
  else if(t.dataset.expand){const l=t.dataset.expand;S.collapsed=l==='all'?new Set():new Set(M.T.filter(x=>x.sum&&x.lvl>=+l).map(x=>x.uid));render();}
  else if(t.dataset.chk!=null){S.chk=+t.dataset.chk;render();}
  else if(t.dataset.phrm!=null){e.stopPropagation();const [pg,i]=t.dataset.phrm.split(':');idbDel(phKey(pg,+i));showPhoto(pg,+i,null);}
  else if(t.dataset.ftog){const u=+t.dataset.ftog;S.fl.c.has(u)?S.fl.c.delete(u):S.fl.c.add(u);render();}
  else if(t.dataset.fx){S.fl.c=t.dataset.fx==='all'?new Set():new Set(M.T.filter(x=>x.sum).map(x=>x.uid));render();}
  else if(t.dataset.fpre){const F=S.fl,cut=sod(S.cutoff),dw=(cut.getDay()+6)%7,dy=n=>isoDay(new Date(cut.getFullYear(),cut.getMonth(),cut.getDate()+n));
    F.ini={a:'',b:''};F.ter={a:'',b:''};const k=t.dataset.fpre;
    if(k==='sem'){F.ter.a=dy(-dw);F.ini.b=dy(4-dw);}
    else if(k==='prox'){F.ter.a=dy(0);F.ini.b=dy(14);}
    else if(k==='ini'){F.ini.a=dy(7-dw);F.ini.b=dy(11-dw);}
    else if(k==='ter'){F.ter.a=dy(-dw);F.ter.b=dy(4-dw);}
    render();}
  else if(t.dataset.pgsel){S.pgId=t.dataset.pgsel;render();}
  else if(t.id==='weekAuto'){S.week='';saveOp();render();}
  else if(t.id==='bkSave'){exportReport();}
  else if(t.id==='bkOpen'){$('#bkIn').click();}
  else if(t.id==='pdef'){const P=CP();P.auto=true;P.cards=null;saveOp();render();}
  else if(t.classList.contains('ph')){S.phTarget={pg:t.dataset.pg,slot:+t.dataset.slot};$('#phIn').click();}
  else if(t.dataset.oprm!=null){CP().cards.splice(+t.dataset.oprm,1);cardsEdited();}
  else if(t.dataset.mact!=null){setActive(+t.dataset.mact);}
  else if(t.dataset.mrm!=null){if(confirm('Remover este cronograma da análise?'))removeModel(+t.dataset.mrm);}
  else if(t.id==='btnAdd')$('#fileAdd').click();
  else if(t.id==='opMan'){CP().cards.push({t:'',k:[],man:{real:'',prev:'',ad:'',date:'',label:''}});cardsEdited();}
  else if(t.id==='opNew'){CP().cards.push({t:'',k:[]});cardsEdited();}
  else if(t.dataset.cki!=null){const [i,j]=t.dataset.cki.split(':').map(Number);CP().cards[i].k.splice(j,1);cardsEdited();}
  else if(t.dataset.cup!=null){const i=+t.dataset.cup;if(i>0){[CP().cards[i-1],CP().cards[i]]=[CP().cards[i],CP().cards[i-1]];cardsEdited();}}
  else if(t.dataset.cdn!=null){const i=+t.dataset.cdn;if(i<CP().cards.length-1){[CP().cards[i+1],CP().cards[i]]=[CP().cards[i],CP().cards[i+1]];cardsEdited();}}
  else if(t.id==='phMinus'){CP().nPhotos=Math.max(1,CP().nPhotos-1);saveOp();render();}
  else if(t.id==='phPlus'){CP().nPhotos=Math.min(CP().type==='disc'?4:9,CP().nPhotos+1);saveOp();render();}
  else if(t.id==='btnPrint'){window.print();}
  else if(t.dataset.cardrm){S.cards=S.cards.filter(u=>u!==+t.dataset.cardrm);saveCards();render();}
  else if(t.dataset.cardlvl){const l=+t.dataset.cardlvl;for(const x of M.T.filter(x=>x.sum&&x.lvl===l))if(!S.cards.includes(x.uid))S.cards.push(x.uid);saveCards();render();}
  else if(t.dataset.cardscope){M.scope=+t.dataset.cardscope;reanalyze();}
  else if(t.id==='cardAdd'){const u=+$('#cardSel').value;if(!S.cards.includes(u))S.cards.push(u);saveCards();render();}
  else if(t.id==='cardClear'){S.cards=[];saveCards();render();}
  else if(t.id==='btnOpen'||t.id==='btnNew')$('#fileIn').click();
  else if(t.id==='btnToday'){S.cutoff=sod(new Date());reanalyze();}
  else if(t.id==='btnStatus'){S.cutoff=M.status;reanalyze();}
  else if(t.id==='btnCmp')$('#fileCmp').click();
  else if(t.id==='btnCmpX'){M.cmp=null;CMP=null;if(S.base==='compare')S.base='auto';reanalyze();}
});

  else if(t.id==='bkIn'&&t.files[0]){importReport(t.files[0]);t.value='';}
  else if(t.id==='phIn'&&t.files[0]){setPhoto(S.phTarget.pg,S.phTarget.slot,t.files[0]);t.value='';}
  else if(t.id==='actSel'){setActive(+t.value);}
  else if(t.dataset.cadd!=null){if(t.value){const c=CP().cards[+t.dataset.cadd];if(!c.k.includes(t.value))c.k.push(t.value);cardsEdited();}}
  else if(t.dataset.cdt!=null){CP().cards[+t.dataset.cdt].dt=t.value;cardsEdited();}
  else if(t.dataset.mf!=null){const [i,f]=t.dataset.mf.split(':');CP().cards[+i].man[f]=t.value;cardsEdited();}
  else if(t.dataset.ctitle!=null){CP().cards[+t.dataset.ctitle].t=t.value.trim();cardsEdited();}
  else if(t.dataset.mdisc!=null){S.models[+t.dataset.mdisc].disc=t.value;saveOp();render();}
  else if(t.dataset.mw!=null){S.models[+t.dataset.mw].wman=+t.value>0?+t.value:null;saveOp();render();}
  else if(t.id==='opCurve'){CP().curve=t.value;saveOp();render();}
  else if(t.id==='pdisc'){const P=CP();P.disc=t.value;P.curve='disc:'+P.disc;P.auto=true;P.cards=null;saveOp();render();}
  else if(t.id==='opFs'){S.op.fs=+t.value;saveOp();render();}
  else if(t.id==='fileCmp'&&t.files[0]){loadCmp(t.files[0]);t.value='';}
});
function reanalyze(){analyzeAll();render();}
for(const ev of ['dragover','dragenter'])document.addEventListener(ev,e=>{e.preventDefault();const d=$('#drop');if(d)d.classList.add('over');});
for(const ev of ['dragleave','drop'])document.addEventListener(ev,e=>{const d=$('#drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{e.preventDefault();const fs=[...e.dataTransfer.files];if(!fs.length)return;
  const ph=e.target.closest&&e.target.closest('.ph');
  if(ph){setPhoto(ph.dataset.pg,+ph.dataset.slot,fs[0]);return;}
  if(M&&S.tab==='comparar'&&e.shiftKey)loadCmp(fs[0]);else loadMain(fs.filter(f=>/\.(xml|mpp)$/i.test(f.name)),!!M&&S.tab==='onepage');});

async function readModel(f){
  if(/\.mpp$/i.test(f.name))throw new Error('Arquivos .mpp não são lidos diretamente. No MS Project use Arquivo › Salvar como › "XML do Project" e carregue o .xml.');
  $('#loading').style.display='flex';
  await new Promise(r=>setTimeout(r,30));
  try{const m=build(parseMSP(await f.text()));m.file=f.name;return m;}
  finally{$('#loading').style.display='none';}
}
async function loadMain(files,append){
  try{
    const ms=[];for(const f of [...files])ms.push(await readModel(f));
    if(!ms.length)return;
    const fresh=!append||!S.models.length;
    if(fresh)S.models=[];
    for(const m of ms)addModel(m);
    if(fresh){loadOp();M=S.models[0];CMP=null;S.cutoff=sod(M.status||new Date());S.base='auto';S.tab=S.models.length>1?'onepage':'resumo';S.initCollapse=true;S.sort={};S.filter={};S.chk=null;
      S.real=S.models.some(m=>m.leaves.some(t=>t.aw>0))?'work':'pct';if(S.real==='work')S.weight='work';}
    applyMeta(ms);loadCards();analyzeAll();

    render();
  }catch(err){alert(err.message);}
}
async function loadCmp(f){
  try{const m=await readModel(f);M.cmp=m;CMP=m;S.base=M.hasBase?'baseline':'compare';analyzeAll();render();}
  catch(err){alert(err.message);}
}
render();
</script>
